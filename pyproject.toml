[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "anyfishcount"
version = "0.1.0"
description = "Count the fish in a tank from a photo or a video"
requires-python = ">=3.10"
license = "AGPL-3.0-or-later"
dependencies = ["numpy"]

[tool.setuptools.packages.find]
include = ["anyfishcount*"]
